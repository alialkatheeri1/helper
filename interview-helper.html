<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مساعد المقابلة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;700&display=swap">
<style>
:root{--bg:#0f1417;--panel:#182025;--fg:#eef3f5;--muted:#8fa3ad;--accent:#3fc1a5;--warn:#e0a84a;
--ar:"Noto Kufi Arabic",Tahoma,Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{height:100dvh}
body{background:var(--bg);color:var(--fg);font-family:var(--ar);display:flex;flex-direction:column;gap:12px;
padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
footer{display:flex;gap:10px}
footer button{flex:1;padding:18px 10px;font-size:19px;border-radius:14px}
#q{max-height:22vh;overflow:auto}
@media (max-width:600px){#a{font-size:32px;padding:16px}}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:18px;margin:0;flex:1}
button{font-family:var(--ar);font-size:16px;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;background:var(--accent);color:#06231d;font-weight:700}
button.off{background:#33424a;color:var(--fg)}
#status{font-size:14px;color:var(--muted)}
#status.live{color:var(--accent)}
#q{background:var(--panel);border-radius:10px;padding:12px 14px;font-size:15px;color:var(--muted);direction:ltr;text-align:left;min-height:48px}
#a{flex:1;background:var(--panel);border-radius:14px;padding:22px;font-size:clamp(28px,5vw,46px);line-height:1.7;font-weight:700;overflow:auto}
#a.wait{color:var(--warn);font-size:22px}
#keybox{background:var(--panel);border-radius:10px;padding:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#keybox input{flex:1;min-width:200px;padding:10px;border-radius:8px;border:1px solid #33424a;background:var(--bg);color:var(--fg);direction:ltr}
#err{color:#ff7a7a;font-size:14px}
#logbox{background:var(--panel);border-radius:10px;padding:10px 14px;max-height:40vh;overflow:auto}
#logbox summary{cursor:pointer;color:var(--muted);font-size:15px}
#copylog{margin:10px 0}
.logitem{border-top:1px solid #2a363d;padding:8px 0}
.lq{direction:ltr;text-align:left;color:var(--muted);font-size:14px}
.la{font-size:17px;margin-top:4px}
</style>
</head>
<body>
<header>
  <h1>مساعد المقابلة</h1>
  <span id="status">متوقف</span>
</header>
<div id="keybox" hidden>
  <span>مفتاح Claude API:</span>
  <input id="key" type="password" placeholder="sk-ant-...">
  <button id="savekey">حفظ</button>
</div>
<div id="err"></div>
<div id="q">سؤال المقابل يطلع هنا…</div>
<div id="a">الجواب يطلع هنا بالحروف العربية</div>
<footer>
  <button id="toggle">ابدأ الاستماع</button>
  <button id="now" class="off">جاوب الحين</button>
</footer>
<details id="logbox">
  <summary>سجل المقابلة (<span id="logcount">0</span>)</summary>
  <button id="copylog" class="off">نسخ السجل</button>
  <div id="log"></div>
</details>

<script>
const PROFILE = `Candidate: from Abu Dhabi, UAE. Married.
- ADNOC Distribution since 2016: currently warehouse operator; before that aircraft fuel provider (refuelling aircraft at the airport).
- Tawazun 2013–2015: technician.
- General secondary school certificate (2012/2013). ICDL computer certificate. Safety and first-aid courses.
- Now applying for an administrative job.`;

const JOB = `Job applied for: Document Controller — Supply Operations, ADNOC Distribution.
Duties: manage all incoming/outgoing documents; filing, classification and retention schedules; confidentiality and security of documents; scanning and electronic archiving (EDMS, SharePoint, Excel); version control (e.g. SOP Rev.0 -> Rev.1, old version withdrawn and archived); HSE and QMS documents (ERP, BCP, risk assessments, incident and audit reports, PSI package); registers for tracking; periodic reports.
Candidate's own prepared points (use them):
- About me: about 10 years at ADNOC Distribution in operations; worked with operational documents, daily reports, HSE and quality procedures; wants to move into Document Control because it fits his organisation skills.
- Confidential documents: keep them in restricted folders/systems, share only with authorised people, follow company policy.
- Electronic archiving: check the document is complete, order pages, scan at good quality, standard file naming, save in the right folder/system, update the tracking register.
- Classification system: faster access, less time searching, audit and governance compliance.
- Software: Excel, Word, Outlook, electronic filing; learns new systems quickly (do not claim SharePoint/EDMS experience).
- Unauthorised request: do not share; check his access or get management approval first.
- Accuracy before archiving: check document number, date, revision, signatures/approvals, all pages and attachments, then archive and register.
- Filing = daily-use documents; Archiving = older, less-used documents kept for future reference.
- Pressure: prioritise by importance and deadline, use tracking sheets and task lists.
- HSE documents: safe work procedures, risk assessments, incident reports, emergency plans; only approved versions used.
- Why move from operations: operations gave him a strong understanding of documents and procedures; wants an organised admin role in information management.
- Strengths: organised, accurate, detail-oriented, confidential, follows procedures, works under pressure, long ADNOC experience.
- Why choose him: long ADNOC Distribution experience, understands operational, HSE and quality documents, organised and trustworthy with confidential records, serious about a document-control career.`;

const SYSTEM = `You help a job candidate answer a live English job interview (Microsoft Teams).
${PROFILE}
${JOB}
You receive what the interviewer just said (speech-to-text, may have errors).
Write the candidate's reply in simple, natural spoken English: 1-2 short sentences, max 30 words, first person, true to the profile only (never invent degrees, numbers or jobs).
Return exactly two lines and nothing else:
EN: <the English reply>
AR: <the same English reply written phonetically in Arabic letters so an Arabic reader can read it aloud, e.g. "آي هاف وركد آت أدنوك ديستريبيوشن". Every word must be in Arabic letters, no Latin letters at all>`;

const $ = id => document.getElementById(id);
// key is kept in two places (browser storage + a cookie for this site only), so it survives closing the page
function readCookie(){ const m = document.cookie.match(/(?:^|;\s*)ckey=([^;]*)/); return m ? decodeURIComponent(m[1]) : ""; }
let key = ""; try{ key = localStorage.getItem("ckey") || ""; }catch(e){}
if(!key) key = readCookie();
if(!key) $("keybox").hidden = false;
$("savekey").onclick = () => {
  key = $("key").value.trim(); if(!key) return;
  try{ localStorage.setItem("ckey",key); }catch(e){}
  try{ document.cookie = "ckey="+encodeURIComponent(key)+";max-age=31536000;path=/helper/;secure;samesite=strict"; }catch(e){}
  let saved = ""; try{ saved = localStorage.getItem("ckey") || ""; }catch(e){}
  if(saved===key || readCookie()===key){ $("keybox").hidden = true; $("err").textContent = ""; }
  else $("err").textContent = "المتصفح ما سمح بالحفظ. افتح الرابط من Chrome نفسه، مو من داخل واتساب أو تيليجرام.";
};

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec, listening = false, buffer = "", timer = null, lastEN = "", busy = false;

function words(s){ return s.toLowerCase().replace(/[^a-z\s]/g,"").split(/\s+/).filter(w=>w.length>2); }
function isMyOwnVoice(t){
  if(!lastEN) return false;
  const a = new Set(words(lastEN)), b = words(t);
  if(b.length===0) return true;
  return b.filter(w=>a.has(w)).length / b.length > 0.5;
}

const LOG = [];
function addLog(q, en, ar){
  LOG.push({q, en, ar});
  $("logcount").textContent = LOG.length;
  const item = document.createElement("div"); item.className = "logitem";
  const qd = document.createElement("div"); qd.className = "lq"; qd.textContent = LOG.length + ". " + q;
  const ad = document.createElement("div"); ad.className = "la"; ad.textContent = ar;
  item.append(qd, ad); $("log").append(item);
}
$("copylog").onclick = async () => {
  const txt = LOG.map((l,i)=>`${i+1}. Q: ${l.q}\nA (EN): ${l.en}\nA (AR): ${l.ar}`).join("\n\n");
  try{ await navigator.clipboard.writeText(txt); $("copylog").textContent = "تم النسخ ✓"; }
  catch(e){ $("copylog").textContent = "ما انحفظ، جرّب مرة ثانية"; }
  setTimeout(()=>$("copylog").textContent="نسخ السجل", 2000);
};

let sessionFinal = "";
// mode "question": listening to the interviewer. mode "reading": Ali is reading the answer — the answer stays on screen
// however long he pauses; it only changes when what is heard sounds like a new interviewer question
// (question words such as what/how/why/tell/you, and not matching the answer he is reading).
let mode = "question";
const CUES = ["what","how","why","tell","describe","explain","could","would","can","do","does","did","when","where","which","who","you","your","yourself"];
const COMMON = ["about","the","and","have","has","for","with","this","that","are","was","from","they","them","into","our","all"];
function overlap(t){
  const keep = w => !CUES.includes(w) && !COMMON.includes(w);
  const a = new Set(words(lastEN).filter(keep)), b = words(t).filter(keep);
  return b.length ? b.filter(w=>a.has(w)).length / b.length : 0;
}
function isNewQuestion(t){
  const all = t.toLowerCase().replace(/[^a-z\s]/g,"").split(/\s+/).filter(Boolean);
  const ans = new Set(lastEN.toLowerCase().replace(/[^a-z\s]/g,"").split(/\s+/));
  // a question word that is not part of the answer he is reading = the interviewer is talking
  return all.length >= 3 && all.some(w=>CUES.includes(w) && !ans.has(w)) && overlap(t) < 0.5;
}
function setMode(m){
  mode = m;
  if(listening) $("status").textContent = m==="reading" ? "دورك تقرا…" : "يسمع السؤال…";
}
function flush(){
  clearTimeout(timer);
  const text = (buffer + " " + sessionFinal).trim(); buffer = ""; sessionFinal = "";
  if(mode==="reading"){ if(text && isNewQuestion(text)) ask(text); return; }
  if(!text || isMyOwnVoice(text)) return;
  ask(text);
}

async function ask(text){
  $("q").textContent = text;
  if(!key){ $("err").textContent = "حط مفتاح API أول."; $("keybox").hidden=false; return; }
  setMode("reading");
  busy = true; $("a").className="wait"; $("a").textContent = "لحظة…"; $("err").textContent="";
  try{
    const r = await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{
      "content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-haiku-5-5",max_tokens:1024,system:SYSTEM,
        messages:[{role:"user",content:"Interviewer said: "+text}]})});
    const j = await r.json();
    if(!r.ok) throw new Error(j.error?.message || r.status);
    const out = j.content.map(c=>c.type==="text"?c.text:"").join("").trim();
    if(!out) throw new Error("ما وصل جواب ("+j.stop_reason+")");
    lastEN = (out.match(/EN:\s*(.*)/)||[])[1] || "";
    const ar = (out.match(/AR:\s*(.*)/)||[])[1] || out;
    $("a").className=""; $("a").textContent = ar.trim();
    addLog(text, lastEN, ar.trim());
  }catch(e){ $("a").className=""; $("a").textContent=""; $("err").textContent = "خطأ: "+e.message; setMode("question"); }
  busy = false;
}

function start(){
  if(!SR){ $("err").textContent = "افتح الصفحة في Safari (آيفون) أو Chrome (أندرويد)."; return; }
  rec = new SR(); rec.lang = "en-US"; rec.continuous = true; rec.interimResults = true;
  rec.onresult = e => {
    let interim = "";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t = e.results[i][0].transcript.trim();
      if(e.results[i].isFinal){
        // Android repeats earlier words in each new result; keep only the latest full version
        if(sessionFinal && t.toLowerCase().startsWith(sessionFinal.toLowerCase())) sessionFinal = t;
        else sessionFinal = (sessionFinal + " " + t).trim();
      } else interim = t;
    }
    if(mode==="question") $("q").textContent = (buffer + " " + sessionFinal + " " + interim).trim();
    clearTimeout(timer); timer = setTimeout(flush, 1800);
  };
  rec.onerror = e => { if(e.error!=="no-speech") $("err").textContent = "المايك: "+e.error; };
  rec.onend = () => {
    if(sessionFinal){ buffer += " " + sessionFinal; sessionFinal = ""; }
    if(listening) try{rec.start()}catch(e){}
  };
  rec.start(); listening = true;
  try{ navigator.wakeLock && navigator.wakeLock.request("screen"); }catch(e){}
  setMode("question"); $("status").className="live";
  $("toggle").textContent="وقّف"; $("toggle").className="off";
}
function stop(){
  listening = false; try{rec&&rec.stop()}catch(e){}
  $("status").textContent="متوقف"; $("status").className="";
  $("toggle").textContent="ابدأ الاستماع"; $("toggle").className="";
}
$("toggle").onclick = () => listening ? stop() : start();
$("now").onclick = () => { lastEN=""; mode="question"; flush(); };
</script>
</body>
</html>
